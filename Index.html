<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SplitPay — UPI Payment Splitter</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#4338ca 0%,transparent 35%),
        radial-gradient(circle at bottom right,#0ea5e9 0%,transparent 35%),
        #070b18;
    color:white;
    padding:25px;
}

.container{
    max-width:1050px;
    margin:auto;
}

/* HEADER */

header{
    text-align:center;
    padding:35px 10px;
}

.logo{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:28px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo span{
    background:linear-gradient(135deg,#8b5cf6,#06b6d4);
    padding:10px 12px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(99,102,241,.35);
}

header h1{
    margin-top:25px;
    font-size:clamp(35px,7vw,65px);
    line-height:1;
    background:linear-gradient(90deg,#fff,#a5b4fc,#67e8f9);
    -webkit-background-clip:text;
    color:transparent;
}

header p{
    margin-top:18px;
    color:#aeb7cf;
    font-size:17px;
}

/* MAIN CARD */

.glass{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-radius:28px;
    box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.form-card{
    padding:30px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.input-box{
    margin-bottom:20px;
}

.input-box.full{
    grid-column:1/-1;
}

label{
    display:block;
    margin-bottom:9px;
    color:#cbd5e1;
    font-size:14px;
    font-weight:700;
}

input,select{
    width:100%;
    padding:16px 17px;
    background:rgba(0,0,0,.25);
    color:white;
    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;
    outline:none;
    font-size:16px;
}

input:focus,select:focus{
    border-color:#818cf8;
    box-shadow:0 0 0 4px rgba(99,102,241,.13);
}

select option{
    color:#111;
}

/* LIVE PREVIEW */

.preview{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-top:5px;
    margin-bottom:25px;
    padding:20px;
    border-radius:18px;
    background:rgba(99,102,241,.10);
    border:1px solid rgba(129,140,248,.18);
}

.preview-title{
    color:#aeb7cf;
    font-size:13px;
}

.preview-value{
    font-size:27px;
    font-weight:800;
    margin-top:5px;
}

.qr-count{
    text-align:right;
}

.qr-count strong{
    display:block;
    font-size:30px;
    color:#67e8f9;
}

.generate{
    width:100%;
    padding:17px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,#6366f1,#06b6d4);
    color:white;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 15px 35px rgba(79,70,229,.28);
}

.generate:hover{
    transform:translateY(-2px);
    box-shadow:0 20px 45px rgba(79,70,229,.4);
}

.error{
    color:#fca5a5;
    margin-top:12px;
    text-align:center;
}

/* RESULT */

#result{
    display:none;
    margin-top:35px;
}

.result-head{
    text-align:center;
    margin-bottom:25px;
}

.result-head h2{
    font-size:30px;
}

.result-head p{
    color:#aeb7cf;
    margin-top:8px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.payment-card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:24px;
    padding:22px;
    text-align:center;
    transition:.25s;
    animation:appear .5s ease both;
}

.payment-card:hover{
    transform:translateY(-5px);
    border-color:rgba(103,232,249,.35);
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.payment-number{
    color:#a5b4fc;
    font-weight:800;
    font-size:14px;
}

.payment-amount{
    font-size:32px;
    font-weight:900;
    margin:8px 0 18px;
}

.qr{
    width:190px;
    height:190px;
    margin:auto;
    background:white;
    padding:5px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.qr img{
    max-width:100%;
}

.pay{
    margin-top:18px;
    width:100%;
    padding:14px;
    border:0;
    border-radius:13px;
    background:#10b981;
    color:white;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
}

.copy{
    margin-top:9px;
    width:100%;
    padding:12px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:13px;
    background:rgba(255,255,255,.06);
    color:white;
    font-weight:700;
    cursor:pointer;
}

.status{
    margin-top:12px;
    color:#94a3b8;
    font-size:12px;
}

/* TOTAL */

.total-box{
    margin-top:25px;
    padding:22px;
    text-align:center;
    border-radius:20px;
    background:linear-gradient(
        135deg,
        rgba(99,102,241,.15),
        rgba(6,182,212,.12)
    );
}

.total-box span{
    color:#aeb7cf;
}

.total-box strong{
    display:block;
    font-size:35px;
    margin-top:5px;
}

/* FOOTER */

footer{
    text-align:center;
    padding:35px 10px 10px;
    color:#7f8ba6;
    font-size:13px;
    line-height:1.7;
}

.badge{
    display:inline-block;
    margin-top:10px;
    padding:7px 12px;
    border-radius:50px;
    background:rgba(16,185,129,.10);
    color:#6ee7b7;
}

/* MOBILE */

@media(max-width:650px){

    body{
        padding:12px;
    }

    header{
        padding:25px 5px;
    }

    header h1{
        font-size:42px;
    }

    .form-card{
        padding:20px;
    }

    .grid{
        grid-template-columns:1fr;
        gap:0;
    }

    .input-box.full{
        grid-column:auto;
    }

    .preview{
        flex-direction:column;
        align-items:flex-start;
    }

    .qr-count{
        text-align:left;
    }

    .cards{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<header>

    <div class="logo">
        <span>⚡</span>
        SplitPay
    </div>

    <h1>Smart UPI Splitting</h1>

    <p>
        Create multiple UPI payment requests from one total amount.
    </p>

</header>


<!-- FORM -->

<div class="glass form-card">

    <div class="grid">

        <div class="input-box full">
            <label>Merchant Name</label>

            <input
                id="merchant"
                type="text"
                placeholder="e.g. ABC Store"
            >
        </div>


        <div class="input-box">
            <label>UPI ID</label>

            <input
                id="upi"
                type="text"
                placeholder="merchant@upi"
            >
        </div>


        <div class="input-box">
            <label>Total Amount (₹)</label>

            <input
                id="amount"
                type="number"
                min="1"
                step="0.01"
                placeholder="4500"
                oninput="updatePreview()"
            >
        </div>


        <div class="input-box full">

            <label>Automatic Split Rule</label>

            <select id="rule" onchange="updatePreview()">

                <option value="1000">
                    Maximum ₹1,000 per payment
                </option>

                <option value="500">
                    Maximum ₹500 per payment
                </option>

                <option value="2000">
                    Maximum ₹2,000 per payment
                </option>

            </select>

        </div>

    </div>


    <!-- LIVE PREVIEW -->

    <div class="preview">

        <div>

            <div class="preview-title">
                TOTAL PAYMENT
            </div>

            <div class="preview-value"
                 id="previewAmount">
                ₹0
            </div>

        </div>


        <div class="qr-count">

            <span class="preview-title">
                QR CODES
            </span>

            <strong id="previewCount">
                0
            </strong>

        </div>

    </div>


    <button
        class="generate"
        onclick="generate()">

        ✨ Generate Payment QR Codes

    </button>

    <div id="error" class="error"></div>

</div>


<!-- RESULT -->

<div id="result">

    <div class="result-head">

        <h2>Payment Ready</h2>

        <p id="merchantText"></p>

    </div>


    <div id="cards" class="cards"></div>


    <div class="total-box">

        <span>Total Amount</span>

        <strong id="totalResult">
            ₹0
        </strong>

    </div>

</div>


<footer>

    UPI authentication happens inside your selected UPI application.
    <br>

    <span class="badge">
        🔒 PIN / OTP is never collected here
    </span>

</footer>

</div>


<script>

/* -----------------------------
   AUTOMATIC QR COUNT
----------------------------- */

function calculateParts(amount, maxAmount){

    if(amount <= 0){
        return 0;
    }

    return Math.ceil(amount / maxAmount);
}


/* -----------------------------
   LIVE PREVIEW
----------------------------- */

function updatePreview(){

    const amount =
        parseFloat(
            document.getElementById("amount").value
        ) || 0;

    const maxAmount =
        parseFloat(
            document.getElementById("rule").value
        );

    const count =
        calculateParts(amount,maxAmount);


    document.getElementById("previewAmount")
        .innerText =
        "₹" + amount.toFixed(2);


    document.getElementById("previewCount")
        .innerText =
        count;
}


/* -----------------------------
   GENERATE
----------------------------- */

function generate(){

    const merchant =
        document.getElementById("merchant")
        .value.trim();

    const upi =
        document.getElementById("upi")
        .value.trim();

    const amount =
        parseFloat(
            document.getElementById("amount").value
        );

    const maxAmount =
        parseFloat(
            document.getElementById("rule").value
        );

    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");

    const cards =
        document.getElementById("cards");


    error.innerText = "";

    cards.innerHTML = "";


    /* VALIDATION */

    if(!merchant){

        error.innerText =
            "Please enter merchant name.";

        return;
    }


    if(!upi || !upi.includes("@")){

        error.innerText =
            "Please enter a valid UPI ID.";

        return;
    }


    if(!amount || amount <= 0){

        error.innerText =
            "Please enter a valid amount.";

        return;
    }


    /* CALCULATE */

    const count =
        calculateParts(amount,maxAmount);


    /*
       Create amounts.

       The final part receives the remainder,
       so the sum always equals the original amount.
    */

    let remaining = amount;


    for(let i=1;i<=count;i++){

        const paymentAmount =
            Math.min(maxAmount,remaining);

        remaining =
            Math.round(
                (remaining-paymentAmount)*100
            )/100;


        /* UPI URL */

        const upiUrl =
            "upi://pay" +
            "?pa=" + encodeURIComponent(upi) +
            "&pn=" + encodeURIComponent(merchant) +
            "&am=" + encodeURIComponent(
                paymentAmount.toFixed(2)
            ) +
            "&cu=INR";


        /* CARD */

        const card =
            document.createElement("div");

        card.className =
            "payment-card";

        card.style.animationDelay =
            ((i-1)*0.08) + "s";


        card.innerHTML = `

            <div class="payment-number">
                PAYMENT ${i} OF ${count}
            </div>

            <div class="payment-amount">
                ₹${paymentAmount.toFixed(2)}
            </div>

            <div class="qr" id="qr${i}"></div>

            <button
                class="pay"
                onclick="openUPI('${safeJS(upiUrl)}')">

                📱 Open UPI App

            </button>

            <button
                class="copy"
                onclick="copyLink('${safeJS(upiUrl)}')">

                📋 Copy Payment Link

            </button>

            <div class="status">
                Payment ${i} ready
            </div>

        `;


        cards.appendChild(card);


        /* QR */

        new QRCode(
            document.getElementById("qr"+i),
            {
                text:upiUrl,
                width:180,
                height:180,
                correctLevel:QRCode.CorrectLevel.M
            }
        );
    }


    /* RESULT */

    result.style.display =
        "block";

    document.getElementById("merchantText")
        .innerText =
        "Paying to " + merchant;


    document.getElementById("totalResult")
        .innerText =
        "₹" + amount.toFixed(2);


    result.scrollIntoView({
        behavior:"smooth"
    });
}


/* -----------------------------
   OPEN UPI
----------------------------- */

function openUPI(url){

    window.location.href = url;
}


/* -----------------------------
   COPY
----------------------------- */

async function copyLink(url){

    try{

        await navigator.clipboard.writeText(url);

        alert(
            "Payment link copied successfully!"
        );

    }catch(e){

        alert(
            "Unable to copy. Please copy manually."
        );
    }
}


/* -----------------------------
   SECURITY HELPERS
----------------------------- */

function safeJS(text){

    return text
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}

</script>

</body>
</html>
