<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070b18">
<title>SplitPay — UPI Payment Splitter</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
    min-height:100vh;
    color:#fff;
    background:
      radial-gradient(circle at 10% 10%,rgba(99,102,241,.35),transparent 32%),
      radial-gradient(circle at 90% 85%,rgba(6,182,212,.25),transparent 32%),
      #050816;
    padding:18px;
}

.container{
    width:min(1100px,100%);
    margin:auto;
}

/* HEADER */

.header{
    text-align:center;
    padding:35px 10px 28px;
}

.logo{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:25px;
    font-weight:900;
}

.logo-icon{
    width:45px;
    height:45px;
    display:grid;
    place-items:center;
    border-radius:14px;
    background:linear-gradient(135deg,#6366f1,#06b6d4);
    box-shadow:0 12px 35px rgba(99,102,241,.4);
}

.header h1{
    margin-top:22px;
    font-size:clamp(38px,7vw,70px);
    line-height:1;
    letter-spacing:-3px;
    background:linear-gradient(90deg,#fff,#a5b4fc,#67e8f9);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.header p{
    margin:16px auto 0;
    max-width:650px;
    color:#a7b0c5;
    font-size:16px;
}

/* GLASS */

.glass{
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.12);
    border-radius:26px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 25px 80px rgba(0,0,0,.35);
}

/* FORM */

.form{
    padding:28px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.field.full{
    grid-column:1/-1;
}

label{
    display:block;
    margin-bottom:8px;
    color:#cbd5e1;
    font-size:13px;
    font-weight:800;
}

input,select{
    width:100%;
    padding:15px 16px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.13);
    outline:none;
    background:rgba(0,0,0,.25);
    color:#fff;
    font-size:16px;
}

input:focus,select:focus{
    border-color:#818cf8;
    box-shadow:0 0 0 4px rgba(99,102,241,.12);
}

select option{
    color:#111;
}

/* PREVIEW */

.preview{
    margin:22px 0;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    border-radius:18px;
    background:linear-gradient(
        135deg,
        rgba(99,102,241,.13),
        rgba(6,182,212,.08)
    );
    border:1px solid rgba(129,140,248,.17);
}

.preview small{
    color:#9aa6bd;
}

.preview-amount{
    font-size:27px;
    font-weight:900;
    margin-top:4px;
}

.count{
    text-align:right;
}

.count strong{
    display:block;
    color:#67e8f9;
    font-size:30px;
}

.generate{
    width:100%;
    border:0;
    padding:17px;
    border-radius:14px;
    cursor:pointer;
    color:#fff;
    font-size:16px;
    font-weight:900;
    background:linear-gradient(135deg,#6366f1,#06b6d4);
    box-shadow:0 14px 35px rgba(79,70,229,.3);
    transition:.2s;
}

.generate:hover{
    transform:translateY(-2px);
}

.error{
    color:#fca5a5;
    text-align:center;
    margin-top:12px;
    min-height:20px;
}

/* RESULTS */

#results{
    display:none;
    margin-top:30px;
}

.result-heading{
    text-align:center;
    margin-bottom:20px;
}

.result-heading h2{
    font-size:30px;
}

.result-heading p{
    margin-top:6px;
    color:#9ca8bd;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.card{
    padding:21px;
    text-align:center;
    border-radius:22px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    animation:show .45s ease both;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(18px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.part{
    color:#a5b4fc;
    font-size:13px;
    font-weight:900;
}

.amount{
    margin:7px 0 17px;
    font-size:32px;
    font-weight:900;
}

.qr{
    width:190px;
    height:190px;
    margin:auto;
    padding:5px;
    display:grid;
    place-items:center;
    background:#fff;
    border-radius:15px;
}

.qr img{
    max-width:100%;
}

.pay{
    width:100%;
    margin-top:17px;
    padding:13px;
    border:0;
    border-radius:12px;
    background:#10b981;
    color:white;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

.copy{
    width:100%;
    margin-top:9px;
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);
    color:white;
    font-weight:800;
    cursor:pointer;
}

.copy:active,
.pay:active{
    transform:scale(.98);
}

.note{
    margin-top:10px;
    color:#7f8ca3;
    font-size:11px;
    word-break:break-all;
}

/* TOTAL */

.total{
    margin-top:20px;
    padding:23px;
    text-align:center;
    border-radius:20px;
    background:rgba(99,102,241,.10);
    border:1px solid rgba(129,140,248,.14);
}

.total span{
    color:#9da8bb;
}

.total strong{
    display:block;
    margin-top:5px;
    font-size:36px;
}

/* FOOTER */

.footer{
    text-align:center;
    color:#758198;
    font-size:12px;
    line-height:1.7;
    padding:30px 10px 15px;
}

.safe{
    display:inline-block;
    margin-top:8px;
    padding:6px 11px;
    border-radius:50px;
    color:#6ee7b7;
    background:rgba(16,185,129,.08);
}

/* MOBILE */

@media(max-width:650px){

    body{
        padding:10px;
    }

    .header{
        padding-top:25px;
    }

    .header h1{
        letter-spacing:-2px;
    }

    .form{
        padding:20px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .preview{
        flex-direction:column;
        align-items:flex-start;
    }

    .count{
        text-align:left;
    }

    .cards{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">

        <div class="logo">
            <div class="logo-icon">⚡</div>
            SplitPay
        </div>

        <h1>Smart UPI Payments</h1>

        <p>
            Create multiple UPI payment QR codes from one total amount.
        </p>

    </header>


    <section class="glass form">

        <div class="form-grid">

            <div class="field full">

                <label>MERCHANT NAME</label>

                <input
                    id="merchant"
                    type="text"
                    placeholder="ABC Store"
                    autocomplete="off"
                >

            </div>


            <div class="field">

                <label>UPI ID</label>

                <input
                    id="upi"
                    type="text"
                    placeholder="merchant@upi"
                    autocomplete="off"
                >

            </div>


            <div class="field">

                <label>TOTAL AMOUNT (₹)</label>

                <input
                    id="amount"
                    type="number"
                    min="1"
                    step="0.01"
                    placeholder="4500"
                    oninput="preview()"
                >

            </div>


            <div class="field full">

                <label>AUTOMATIC SPLIT LIMIT</label>

                <select id="limit" onchange="preview()">

                    <option value="1000">
                        Maximum ₹1,000 per payment
                    </option>

                    <option value="500">
                        Maximum ₹500 per payment
                    </option>

                    <option value="2000">
                        Maximum ₹2,000 per payment
                    </option>

                </select>

            </div>

        </div>


        <div class="preview">

            <div>
                <small>TOTAL</small>

                <div
                    class="preview-amount"
                    id="previewAmount">
                    ₹0.00
                </div>
            </div>


            <div class="count">

                <small>QR CODES</small>

                <strong id="previewCount">0</strong>

            </div>

        </div>


        <button
            class="generate"
            onclick="generate()">

            ✨ Generate QR Codes

        </button>

        <div
            class="error"
            id="error">
        </div>

    </section>


    <section id="results">

        <div class="result-heading">

            <h2>Payment Parts</h2>

            <p id="merchantText"></p>

        </div>


        <div
            class="cards"
            id="cards">
        </div>


        <div class="total">

            <span>Total Payment</span>

            <strong id="totalAmount">₹0.00</strong>

        </div>

    </section>


    <footer class="footer">

        Payment approval happens inside the user's UPI app.

        <br>

        <span class="safe">
            🔒 UPI PIN / OTP is never collected
        </span>

    </footer>

</div>


<script>

/* =====================================
   CALCULATE AUTOMATIC QR COUNT
===================================== */

function getCount(amount,limit){

    if(amount <= 0) return 0;

    return Math.ceil(amount / limit);
}


/* =====================================
   LIVE PREVIEW
===================================== */

function preview(){

    const amount =
        Number(
            document.getElementById("amount").value
        ) || 0;

    const limit =
        Number(
            document.getElementById("limit").value
        );

    const count =
        getCount(amount,limit);


    document.getElementById("previewAmount")
        .textContent =
        "₹" + amount.toFixed(2);


    document.getElementById("previewCount")
        .textContent =
        count;
}


/* =====================================
   GENERATE QR CODES
===================================== */

function generate(){

    const merchant =
        document.getElementById("merchant")
        .value.trim();

    const upi =
        document.getElementById("upi")
        .value.trim();

    const amount =
        Number(
            document.getElementById("amount").value
        );

    const limit =
        Number(
            document.getElementById("limit").value
        );

    const error =
        document.getElementById("error");

    const results =
        document.getElementById("results");

    const cards =
        document.getElementById("cards");


    error.textContent = "";
    cards.innerHTML = "";


    /* VALIDATION */

    if(!merchant){

        error.textContent =
            "Enter merchant name.";

        return;
    }


    if(!upi || !upi.includes("@")){

        error.textContent =
            "Enter a valid UPI ID.";

        return;
    }


    if(!amount || amount <= 0){

        error.textContent =
            "Enter a valid amount.";

        return;
    }


    /* SPLIT */

    let remaining =
        Math.round(amount * 100) / 100;

    const count =
        getCount(amount,limit);


    for(let i=1;i<=count;i++){

        const part =
            Math.min(limit,remaining);

        remaining =
            Math.round(
                (remaining-part)*100
            )/100;


        /* UPI PAYMENT URI */

        const upiUrl =
            "upi://pay" +
            "?pa=" + encodeURIComponent(upi) +
            "&pn=" + encodeURIComponent(merchant) +
            "&am=" + encodeURIComponent(
                part.toFixed(2)
            ) +
            "&cu=INR";


        /* CARD */

        const card =
            document.createElement("div");

        card.className = "card";

        card.style.animationDelay =
            ((i-1)*.07) + "s";


        const qrId =
            "qr_" + i + "_" + Date.now();


        card.innerHTML = `

            <div class="part">
                PAYMENT ${i} / ${count}
            </div>

            <div class="amount">
                ₹${part.toFixed(2)}
            </div>

            <div
                class="qr"
                id="${qrId}">
            </div>

            <button
                class="pay"
                onclick="openUPI('${safe(upiUrl)}')">

                📱 Open UPI App

            </button>

            <button
                class="copy"
                onclick="copyUPI('${safe(upiUrl)}')">

                📋 Copy Payment Link

            </button>

            <div class="note">
                ${escapeHTML(upiUrl)}
            </div>
        `;


        cards.appendChild(card);


        /* QR GENERATION */

        new QRCode(
            document.getElementById(qrId),
            {
                text:upiUrl,
                width:180,
                height:180,
                correctLevel:
                    QRCode.CorrectLevel.M
            }
        );
    }


    document.getElementById("merchantText")
        .textContent =
        "Payment to " + merchant;


    document.getElementById("totalAmount")
        .textContent =
        "₹" + amount.toFixed(2);


    results.style.display = "block";


    results.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
}


/* =====================================
   OPEN UPI APP
===================================== */

function openUPI(url){

    window.location.href = url;
}


/* =====================================
   COPY PAYMENT LINK
===================================== */

async function copyUPI(url){

    try{

        await navigator.clipboard.writeText(url);

        alert(
            "UPI payment link copied!"
        );

    }catch(e){

        alert(
            "Copy failed. Please copy the link manually."
        );
    }
}


/* =====================================
   BASIC SECURITY HELPERS
===================================== */

function safe(text){

    return text
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
